<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Добавить материал — MediaGallery</title>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/main.css">
  <link rel="stylesheet" href="../assets/css/pages/upload.css">
</head>
<body data-page="upload">
<div data-site-header></div>
<main>
  <section class="page-head">
    <div class="container"><span class="eyebrow">Публикация</span><h1>Добавить материал</h1><p>Загрузите изображение, видео или аудио в общую галерею.</p></div>
  </section>
  <section class="section">
    <div class="container upload-layout">
      <section class="panel">
        <form class="form-grid">
          <label class="form-label">Название материала<input class="field" placeholder="Например, Рассвет в горах"></label>
          <label class="form-label">Описание<textarea class="field field--textarea" placeholder="Кратко расскажите о материале"></textarea></label>
          <div class="form-label">Тип материала
            <div class="chip-row scroll-x"><button type="button" class="chip is-active">Изображение</button><button type="button" class="chip">Видео</button><button type="button" class="chip">Аудио</button></div>
          </div>
          <label class="form-label">Категория<select class="field"><option>Фотографии</option><option>Музыка</option><option>Обучение</option><option>Развлечения</option><option>Другое</option></select></label>
          <label class="form-row"><span><input type="checkbox"> Добавить ссылку вместо файла</span></label>
        </form>
      </section>

      <section class="panel">
        <div class="dropzone">
          <span class="material-symbol">cloud_upload</span>
          <h3>Перетащите файл сюда</h3>
          <p>или нажмите, чтобы выбрать</p>
          <small>JPG, PNG, WEBP · MP4, WEBM · MP3, WAV, OGG</small>
        </div>
        <div class="upload-actions">
          <button class="btn btn--secondary">Отмена</button>
          <button class="btn btn--primary" data-toast-trigger>Опубликовать</button>
        </div>
      </section>
    </div>
  </section>
</main>
<div class="toast" data-toast>Материал успешно добавлен</div>
<div data-site-footer></div><div data-site-bottom></div><script type="module" src="../assets/js/main.js"></script>
</body>
</html>
