<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Вход — MediaGallery</title>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/main.css">
  <link rel="stylesheet" href="../assets/css/pages/auth.css">
</head>
<body data-page="login">
<div data-site-header></div>
<main class="auth-layout">
  <section class="auth-card">
    <span class="eyebrow">Авторизация</span>
    <h1>Вход</h1>
    <p>Войдите в свой аккаунт MediaGallery.</p>
    <form class="form-grid">
      <label class="form-label">Email или имя пользователя<input class="field" placeholder="alex@example.com"></label>
      <label class="form-label">Пароль<input class="field" type="password" placeholder="••••••••"></label>
      <div class="form-row"><label><input type="checkbox"> Запомнить меня</label><a class="link" href="#">Забыли пароль?</a></div>
      <a class="btn btn--primary" href="profile.html">Войти</a>
      <div class="form-row"><span>Нет аккаунта?</span><a class="link" href="register.html">Зарегистрироваться</a></div>
    </form>
  </section>
</main>
<div data-site-footer></div><div data-site-bottom></div><script type="module" src="../assets/js/main.js"></script>
</body>
</html>
