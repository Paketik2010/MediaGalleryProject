<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Добавить материал — MediaGallery</title><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"><link rel="stylesheet" href="assets/style.css"></head><body data-page="add"><div id="site-header"></div><main><section class="page-head"><div class="container"><span class="eyebrow">Публикация</span><h1>Добавить материал</h1><p>Загрузите изображение, видео или аудио в общую галерею.</p></div></section><section class="section"><div class="container upload-layout"><div class="panel"><div class="form-grid"><label class="label">Название материала<input class="field" placeholder="Например, Рассвет в горах"></label><label class="label">Описание<textarea class="field textarea" placeholder="Кратко расскажите о материале"></textarea></label><div class="label">Тип материала<div class="chips"><button class="chip active">Изображение</button><button class="chip">Видео</button><button class="chip">Аудио</button></div></div><label class="label">Категория<select class="field"><option>Фотографии</option><option>Музыка</option><option>Обучение</option><option>Развлечения</option><option>Другое</option></select></label><label class="check-row"><span><input type="checkbox"> Добавить ссылку вместо файла</span></label></div></div><div class="panel"><div class="dropzone"><span class="mi">cloud_upload</span><h3>Перетащите файл сюда</h3><p>или нажмите, чтобы выбрать</p><small>JPG, PNG, WEBP · MP4, WEBM · MP3, WAV, OGG</small></div><div class="hero-actions"><button class="btn btn-secondary">Отмена</button><button class="btn btn-primary" data-toast>Опубликовать</button></div></div></div></section></main><div class="toast">Материал успешно добавлен</div><div id="site-bottom"></div><script src="assets/app.js"></script></body></html>
